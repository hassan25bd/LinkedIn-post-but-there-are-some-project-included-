<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Do You Love Me? 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Quicksand',system-ui,sans-serif;
    background:linear-gradient(135deg,#ffd6e0,#ffe9f0 40%,#e8d9ff);
    background-size:200% 200%;
    animation:bg 12s ease infinite;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;color:#4a2038;
  }
  @keyframes bg{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}

  .card{
    position:relative;z-index:2;width:min(92vw,520px);
    padding:32px 28px 38px;text-align:center;
    background:rgba(255,255,255,.8);
    border:1px solid rgba(255,255,255,.9);border-radius:32px;
    box-shadow:0 20px 60px rgba(214,80,120,.25);
    animation:pop .7s cubic-bezier(.2,1.4,.4,1) both;
  }
  @keyframes pop{from{transform:scale(.7);opacity:0}}

  .scene{width:230px;height:200px;margin:0 auto 6px;animation:float 3s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-8px)}}
  .scene svg{width:100%;height:100%;overflow:visible}
  .bubble{position:absolute;top:18px;right:70px;background:#fff;border:2px solid #4a2038;border-radius:18px;
    padding:3px 10px;font-weight:700;font-size:13px;animation:wiggle 1.6s ease-in-out infinite}
  .bubble::after{content:"";position:absolute;bottom:-8px;left:14px;width:10px;height:10px;background:#fff;
    border-right:2px solid #4a2038;border-bottom:2px solid #4a2038;transform:rotate(45deg)}
  @keyframes wiggle{50%{transform:rotate(-4deg) scale(1.05)}}

  h1{font-size:clamp(30px,8vw,46px);line-height:1.15;margin:8px 0 6px;color:#3b1530}
  .sub{min-height:26px;font-size:17px;color:#a2476a;font-weight:500;margin-bottom:22px}

  .buttons{display:flex;gap:18px;justify-content:center;align-items:center;min-height:70px}
  button{
    font:700 18px 'Quicksand',sans-serif;border:0;border-radius:999px;cursor:pointer;
    padding:13px 34px;color:#fff;transition:transform .2s,box-shadow .2s;
  }
  #yes{background:linear-gradient(135deg,#ff5d8f,#ff2e63);box-shadow:0 8px 20px rgba(255,46,99,.45);transform-origin:center}
  #yes:hover{box-shadow:0 10px 28px rgba(255,46,99,.7)}
  #yes.grow{animation:boing .5s cubic-bezier(.2,1.6,.4,1)}
  #yes.beat{animation:beat .8s ease-in-out infinite}
  @keyframes boing{0%{transform:scale(.7) rotate(-8deg)}60%{transform:scale(1.15) rotate(5deg)}100%{transform:scale(1)}}
  @keyframes beat{50%{transform:scale(1.06)}}
  #yes.full{position:fixed;inset:0;z-index:20;width:100vw;height:100vh;border-radius:0;font-size:clamp(34px,9vw,90px);
    animation:beat .8s ease-in-out infinite;padding:0;display:flex;align-items:center;justify-content:center;text-align:center}
  .card.shake{animation:shake .4s}
  @keyframes shake{25%{transform:translateX(-10px) rotate(-1deg)}75%{transform:translateX(10px) rotate(1deg)}}
  .pop{position:fixed;z-index:8;pointer-events:none;font-weight:700;color:#ff2e63;font-size:20px;animation:up 1s ease-out forwards}
  @keyframes up{to{transform:translateY(-70px) scale(1.4);opacity:0}}
  #no{background:linear-gradient(135deg,#b49ac8,#8b7aa8);box-shadow:0 8px 18px rgba(139,122,168,.4);transition:transform .15s,left .25s,top .25s}
  #no.run{position:fixed;z-index:5}

  #mute{position:absolute;top:14px;right:14px;width:40px;height:40px;padding:0;font-size:20px;background:#fff;
    box-shadow:0 4px 12px rgba(214,80,120,.3)}
  .result{display:none}
  .result h2{font-family:'Pacifico',cursive;font-size:clamp(30px,8vw,44px);color:#ff2e63;margin:10px 0}
  .result p{font-size:18px;color:#7a3355}
  .done .ask{display:none}
  .done .result{display:block;animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
  .done .scene{animation:float 1s ease-in-out infinite}
  .again{margin-top:20px;background:#ff5d8f;box-shadow:0 8px 18px rgba(255,46,99,.35);font-size:15px;padding:10px 24px}

  .heart{position:fixed;bottom:-40px;z-index:1;pointer-events:none;animation:rise linear forwards;opacity:.8}
  @keyframes rise{to{transform:translateY(-115vh) rotate(40deg);opacity:0}}
  .confetti{position:fixed;z-index:9;pointer-events:none;animation:burst 1.6s ease-out forwards}
  @keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(540deg) scale(.4);opacity:0}}
  .tear,.stream,.m-sad{opacity:0}
  .sad .m-happy{opacity:0}
  .sad .m-sad{opacity:1}
  .sad .tear{opacity:.9;animation:drip 1.1s ease-in infinite}
  .sad .t2,.sad .t4{animation-delay:.5s}
  @keyframes drip{from{transform:translateY(0);opacity:.9}to{transform:translateY(34px);opacity:0}}
  .sad .scene svg{animation:sob .5s ease-in-out infinite}
  @keyframes sob{50%{transform:translateY(3px) scaleY(.98)}}
  .bawl .stream{opacity:.75;stroke-dasharray:6 8;animation:flow .5s linear infinite}
  .bawl .scene svg{animation:sob .25s ease-in-out infinite}
  @keyframes flow{to{stroke-dashoffset:-14}}
  .sad .blush{animation:none;opacity:.9}
  .blush{animation:blush 2s ease-in-out infinite}
  @keyframes blush{50%{opacity:.55}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main class="card" id="card">
  <button id="mute" aria-label="Mute" title="Sound on/off">🔊</button>
  <div class="scene" style="position:relative">
    <div class="bubble" id="bubble">Reply me 💌</div>
    <svg viewBox="0 0 230 200" aria-label="Two cute bears hugging">
      <!-- brown bear -->
      <g>
        <circle cx="50" cy="78" r="17" fill="#b8764f" stroke="#4a2038" stroke-width="3"/>
        <circle cx="120" cy="78" r="17" fill="#b8764f" stroke="#4a2038" stroke-width="3"/>
        <path d="M22 190 C20 130 34 100 86 100 C138 100 152 130 150 190Z" fill="#c9835a" stroke="#4a2038" stroke-width="3"/>
        <ellipse cx="86" cy="128" rx="58" ry="46" fill="#c9835a" stroke="#4a2038" stroke-width="3"/>
        <ellipse cx="86" cy="128" rx="55" ry="43" fill="#c9835a"/>
        <circle cx="60" cy="136" r="10" fill="#f6a96a" class="blush"/>
        <circle cx="112" cy="136" r="10" fill="#f6a96a" class="blush"/>
        <circle cx="64" cy="120" r="4.5" fill="#2b1020"/>
        <path d="M100 121 q7 -6 14 0" stroke="#2b1020" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path class="m-happy" d="M78 134 q4 6 8 0 q4 6 8 0" stroke="#2b1020" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path class="m-sad" d="M78 140 q8 -9 16 0" stroke="#2b1020" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <ellipse class="tear t1" cx="64" cy="127" rx="3.5" ry="5" fill="#6ec6ff"/>
        <ellipse class="tear t2" cx="107" cy="128" rx="3.5" ry="5" fill="#6ec6ff"/>
        <rect x="70" y="160" width="26" height="34" rx="5" fill="#8cc7f0" stroke="#4a2038" stroke-width="2.5"/>
      </g>
      <!-- panda -->
      <g>
        <circle cx="140" cy="38" r="15" fill="#2b1020"/>
        <circle cx="205" cy="48" r="15" fill="#2b1020"/>
        <path d="M118 190 C116 120 130 82 176 82 C222 82 236 120 234 190Z" fill="#fff" stroke="#4a2038" stroke-width="3"/>
        <ellipse cx="173" cy="76" rx="48" ry="42" fill="#fff" stroke="#4a2038" stroke-width="3"/>
        <ellipse cx="156" cy="72" rx="9" ry="12" fill="#2b1020" transform="rotate(20 156 72)"/>
        <ellipse cx="192" cy="72" rx="9" ry="12" fill="#2b1020" transform="rotate(-20 192 72)"/>
        <circle cx="157" cy="70" r="3" fill="#fff"/>
        <circle cx="191" cy="70" r="3" fill="#fff"/>
        <circle cx="146" cy="92" r="9" fill="#ff9fb4" class="blush"/>
        <circle cx="202" cy="92" r="9" fill="#ff9fb4" class="blush"/>
        <ellipse cx="174" cy="86" rx="5" ry="3.5" fill="#2b1020"/>
        <path class="m-happy" d="M166 93 q8 7 16 0" stroke="#2b1020" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path class="m-sad" d="M166 98 q8 -9 16 0" stroke="#2b1020" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <ellipse class="tear t3" cx="156" cy="85" rx="3.5" ry="5" fill="#6ec6ff"/>
        <ellipse class="tear t4" cx="192" cy="85" rx="3.5" ry="5" fill="#6ec6ff"/>
        <path class="stream" d="M153 84 q-3 20 -1 40 M159 84 q3 20 1 40 M189 84 q-3 20 -1 40 M195 84 q3 20 1 40" stroke="#6ec6ff" stroke-width="5" fill="none" stroke-linecap="round"/>
      </g>
      <g id="hearts-svg" opacity="0">
        <path d="M110 30 c-8 -12 -24 0 -10 12 l10 9 10 -9 c14 -12 -2 -24 -10 -12z" fill="#ff2e63"/>
      </g>
    </svg>
  </div>

  <div class="ask">
    <h1>Do you love me?</h1>
    <p class="sub" id="sub">Be honest… I'm waiting 🥺</p>
    <div class="buttons" id="buttons">
      <button id="yes">Yes 💖</button>
      <button id="no">No</button>
    </div>
  </div>

  <div class="result">
    <h2>Yaaay! I love you too! 💕</h2>
    <p>You just made my whole day. Forever and always. 🐻🐼</p>
    <button class="again" id="again">Ask again 🔁</button>
  </div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const card = $('card'), yes = $('yes'), no = $('no'), sub = $('sub'), bubble = $('bubble');

  let ctx, muted = false;
  const mute = $('mute');
  function ac(){
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(freq, start, dur, {type='sine', vol=.18, to=null} = {}){
    if (muted) return;
    const c = ac(), t = c.currentTime + start;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + .02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t + dur + .05);
  }
  const sfx = {
    sad(n){ // descending "womp womp" plus a sob that gets wetter
      const base = 330 - Math.min(n, 6) * 12;
      tone(base, 0, .28, {type:'triangle', to:base*.8});
      tone(base*.85, .3, .45, {type:'triangle', to:base*.55});
      if (n >= 3) for (let i = 0; i < 4; i++) tone(520 + (i % 2) * 60, .75 + i*.09, .08, {type:'sine', to:380, vol:.1});
    },
    pop(n){ tone(400 + n*60, 0, .12, {type:'square', to:900 + n*80, vol:.07}); },
    yes(){
      [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, i*.09, .35, {type:'triangle', vol:.2}));
      [1047, 1319, 1568, 2093].forEach((f, i) => tone(f, .6 + i*.07, .5, {type:'sine', vol:.12}));
    },
    reset(){ tone(700, 0, .1, {to:500, vol:.1}); }
  };
  mute.addEventListener('click', () => {
    muted = !muted;
    mute.textContent = muted ? '🔇' : '🔊';
    mute.setAttribute('aria-label', muted ? 'Unmute' : 'Mute');
    if (!muted) sfx.pop(0);
  });
  const lines = [
    "Be honest… I'm waiting 🥺",
    "Are you sure? Think again 🥹",
    "Pleeease? 🥺👉👈",
    "My heart is breaking 💔",
    "Okay now you're just teasing me 😭",
    "The No button is shy, try Yes! 😏",
    "You can't catch it. Just say Yes! 💘"
  ];
  let tries = 0, yesScale = 1;

  const colors = ['#ff2e63','#ff9fb4','#ffd166','#b49ac8','#ff5d8f','#fff'];
  const glyphs = ['💖','💕','💗','❤️','💘','✨'];

  function heart(){
    const h = document.createElement('div');
    h.className = 'heart';
    h.textContent = glyphs[Math.random()*glyphs.length|0];
    h.style.left = Math.random()*100 + 'vw';
    h.style.fontSize = (14 + Math.random()*26) + 'px';
    h.style.animationDuration = (5 + Math.random()*6) + 's';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 11000);
  }
  setInterval(heart, 600);
  for (let i = 0; i < 8; i++) setTimeout(heart, i*150);

  const yesLabels = ['Yes 💖','YES! 💖','Say YES 🥺','YESSS 💕','YES YES YES 😍','CLICK ME!! 💘','JUST SAY YES!!! 💞','YES!!!!! 💖💖💖'];
  const wow = ['+1 Yes!','Yes grows! 📈','Bigger! 💪','Love wins 💘','Oops 😆'];

  function growYes(){
    const r = no.getBoundingClientRect();
    const p = document.createElement('div');
    p.className = 'pop';
    p.textContent = wow[tries % wow.length];
    p.style.left = r.left + 'px'; p.style.top = r.top + 'px';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1000);

    card.classList.add('sad');
    sfx.sad(tries); sfx.pop(tries);
    if (tries >= 4) card.classList.add('bawl');
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');

    yes.textContent = yesLabels[Math.min(tries, yesLabels.length - 1)];
    yes.style.fontSize = (18 + tries * 5) + 'px';
    yes.style.padding = `${13 + tries * 4}px ${34 + tries * 10}px`;
    yes.classList.remove('grow'); void yes.offsetWidth; yes.classList.add('grow');
    yes.addEventListener('animationend', () => { if (tries < 8) yes.classList.remove('grow'); if (tries >= 3) yes.classList.add('beat'); }, {once:true});

    if (tries >= 8) {
      no.style.display = 'none';
      yes.classList.remove('grow', 'beat');
      yes.classList.add('full');
      sub.textContent = 'Okay okay, YES takes over 😂';
    }
  }

  function dodge(){
    tries++;
    sub.textContent = lines[Math.min(tries, lines.length - 1)];
    bubble.textContent = ['Reply me 💌','Hey! 🥺','Pleeease 🙏','Say yes! 💘'][tries % 4];
    growYes();

    if (tries >= 2) {
      no.classList.add('run');
      const pad = 12, w = no.offsetWidth, h = no.offsetHeight;
      no.style.left = pad + Math.random()*(innerWidth - w - 2*pad) + 'px';
      no.style.top  = pad + Math.random()*(innerHeight - h - 2*pad) + 'px';
    } else {
      no.style.transform = `translate(${(Math.random()-.5)*120}px,${(Math.random()-.5)*60}px) rotate(${(Math.random()-.5)*20}deg)`;
    }
  }
  no.addEventListener('mouseenter', () => tries >= 1 && dodge());
  no.addEventListener('touchstart', e => { e.preventDefault(); dodge(); }, {passive:false});
  no.addEventListener('click', dodge);

  function confetti(){
    for (let i = 0; i < 90; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      const heartShape = i % 3 === 0;
      c.textContent = heartShape ? glyphs[i % glyphs.length] : '';
      if (!heartShape) {
        c.style.cssText += `width:9px;height:14px;background:${colors[i%colors.length]};border-radius:2px;`;
      } else c.style.fontSize = '22px';
      c.style.left = '50vw'; c.style.top = '40vh';
      const a = Math.random()*Math.PI*2, d = 150 + Math.random()*Math.min(innerWidth,700)/1.6;
      c.style.setProperty('--x', Math.cos(a)*d + 'px');
      c.style.setProperty('--y', Math.sin(a)*d + 'px');
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 1700);
    }
  }

  yes.addEventListener('click', () => {
    card.classList.remove('sad', 'bawl');
    card.classList.add('done');
    sfx.yes();
    yes.classList.remove('full');
    no.classList.remove('run');
    confetti();
    setTimeout(confetti, 450);
    for (let i = 0; i < 20; i++) setTimeout(heart, i*60);
  });

  $('again').addEventListener('click', () => {
    card.classList.remove('done', 'sad', 'bawl');
    sfx.reset();
    tries = 0; yesScale = 1;
    yes.className = ''; yes.style.cssText = ''; yes.textContent = yesLabels[0];
    no.classList.remove('run'); no.style.cssText = '';
    sub.textContent = lines[0]; bubble.textContent = 'Reply me 💌';
  });
})();
</script>
</body>
</html>
